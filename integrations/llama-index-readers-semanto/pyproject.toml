[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "llama-index-readers-semanto"
version = "0.1.0"
description = "LlamaIndex reader for Semanto: a company's signed copy of its website, checked as it is read."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = ["llama-index-core>=0.12", "trooth-semanto-verify>=0.2"]

[tool.setuptools.packages.find]
include = ["llama_index*"]
