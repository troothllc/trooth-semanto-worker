#
# Semanto host adapter for Apache httpd 2.4: mod_rewrite decides on the Accept
# header and the path suffix (never on User-Agent), mod_proxy fetches the
# signed copy from the Trooth API and passes its headers through. Put this
# file in conf-available/ (Debian) or conf.d/ (Red Hat) and Include it inside
# your <VirtualHost>. Replace example-inc with your Trooth ID (six places).
# Needs: mod_rewrite, mod_proxy, mod_proxy_http, mod_ssl, mod_headers, Apache
# 2.4.47 or newer (ProxyErrorOverride with status codes).
# Reference: httpd.apache.org/docs/2.4/rewrite/flags.html (the P flag) and
# httpd.apache.org/docs/2.4/mod/mod_proxy.html

RewriteEngine On
SSLProxyEngine On
ProxyPreserveHost Off
ProxyRequests Off

# ---- Fail safe: the site never waits on Trooth for long and never shows a
# ---- Trooth 5xx. A call gives up after 1 second to connect and 2 to answer;
# ---- a 5xx or a timeout answers with the site's own page at the same address.
<Proxy "https://api.trooth.co/*">
    ProxySet connectiontimeout=1 timeout=2
    ProxyErrorOverride On 500 502 503 504
    ErrorDocument 500 %{REQUEST_URI}
    ErrorDocument 502 %{REQUEST_URI}
    ErrorDocument 503 %{REQUEST_URI}
    ErrorDocument 504 %{REQUEST_URI}
</Proxy>
# The site's own page for that fallback: no Semanto rule runs on it, so it cannot loop.
RewriteCond %{ENV:REDIRECT_STATUS} !^$
RewriteRule ^ - [L,E=SEMANTO_FALLBACK:1]
Header always set Trooth-Delivery host env=SEMANTO_FALLBACK
# Optional: keep the last good copy for when Trooth is down (needs mod_cache and
# mod_cache_disk). CacheStaleOnError serves it on a 5xx.
# CacheEnable disk "https://api.trooth.co/public/semanto/"
# CacheStaleOnError On
# CacheMaxExpire 3600

# ---- Request headers to the API: keep Accept and the conditional and
# ---- signature headers (they pass by default); drop who the reader is.
RequestHeader unset User-Agent env=SEMANTO
RequestHeader unset Cookie env=SEMANTO
RequestHeader unset Authorization env=SEMANTO
# Apache cannot sign, so it never vouches for the reader's host: a reader
# through Apache is an "unproven reader" unless its request reaches the API
# directly (adapters/README.md). Drop any copy a client sent.
RequestHeader unset Trooth-Forwarded-Authority
RequestHeader unset Trooth-Forwarded-For

# ---- The well-known files and the llms files (every mode serves the two
# ---- well-known files; remove the three llms rules for proof_only).
RewriteRule ^/\.well-known/trooth\.semanto$   https://api.trooth.co/public/semanto/example-inc            [P,L,E=SEMANTO:1]
RewriteRule ^/\.well-known/trooth-keys\.json$ https://api.trooth.co/public/semanto/example-inc/keys.json  [P,L,E=SEMANTO:1]
RewriteRule ^/llms\.txt$                      https://api.trooth.co/public/semanto/example-inc/llms.txt   [P,L,E=SEMANTO:1]
RewriteRule ^/llms-full\.txt$                 https://api.trooth.co/public/semanto/example-inc/llms-full.txt [P,L,E=SEMANTO:1]
RewriteRule ^/sitemap\.md$                    https://api.trooth.co/public/semanto/example-inc/sitemap.md [P,L,E=SEMANTO:1]

# ---- semanto_only: pages and facts. Delete from here to "end of pages" for proof_only.

# Path suffix first: it wins over the Accept header.
RewriteCond %{REQUEST_METHOD} ^(GET|HEAD)$
RewriteRule ^(.*\.md)$ https://api.trooth.co/public/semanto/example-inc/by-path$1 [P,L,E=SEMANTO:1]

# The site root's /facts.jsonld is the company's facts; any other .jsonld is the
# page's JSON-LD by its path, the same answer the API gives for /by-path.
RewriteCond %{REQUEST_METHOD} ^(GET|HEAD)$
RewriteRule ^/facts\.jsonld$ https://api.trooth.co/public/semanto/example-inc/facts.jsonld [P,L,E=SEMANTO:1]

RewriteCond %{REQUEST_METHOD} ^(GET|HEAD)$
RewriteRule ^(.*\.jsonld)$ https://api.trooth.co/public/semanto/example-inc/by-path$1 [P,L,E=SEMANTO:1]

# Accept: application/ld+json before any text/html entry and not q=0 -> the page's JSON-LD by path.
RewriteCond %{REQUEST_METHOD} ^(GET|HEAD)$
RewriteCond %{HTTP:Accept} "^(?:(?!text/html)[^,]*,\s*)*application/ld\+json(?:\s*;\s*q=(?!0(?:\.0+)?\s*(?:,|$))[^,]*)?\s*(?:,|$)" [NC,OR]
RewriteCond %{HTTP:Accept} "^(?!.*text/html\s*(?:;\s*(?!q=)[^;,]*\s*)*(?:,|$))(?!.*text/html[^,]*;\s*q=1(?:\.0*)?\s*(?:,|$)).*application/ld\+json\s*(?:;\s*(?!q=)[^;,]*\s*)*(?:;\s*q=1(?:\.0*)?\s*)?(?:,|$)" [NC]
RewriteRule ^(.*)$ https://api.trooth.co/public/semanto/example-inc/by-path$1 [P,L,E=SEMANTO:1]

# Accept: text/markdown or text/* (a) before any text/html entry and not q=0, or
# (b) at full weight while text/html has a q below 1 -> the page's markdown.
# "*/*" alone and a missing header do not match, so browsers get the site. An
# exact tie such as "text/html, text/markdown" goes to the site here.
RewriteCond %{REQUEST_METHOD} ^(GET|HEAD)$
RewriteCond %{HTTP:Accept} "^(?:(?!text/html)[^,]*,\s*)*text/(?:markdown|\*)(?:\s*;\s*q=(?!0(?:\.0+)?\s*(?:,|$))[^,]*)?\s*(?:,|$)" [NC,OR]
RewriteCond %{HTTP:Accept} "^(?!.*text/html\s*(?:;\s*(?!q=)[^;,]*\s*)*(?:,|$))(?!.*text/html[^,]*;\s*q=1(?:\.0*)?\s*(?:,|$)).*text/(?:markdown|\*)\s*(?:;\s*(?!q=)[^;,]*\s*)*(?:;\s*q=1(?:\.0*)?\s*)?(?:,|$)" [NC]
RewriteRule ^(.*)$ https://api.trooth.co/public/semanto/example-inc/by-path$1 [P,L,E=SEMANTO:1]

# ---- end of pages

# ---- Response headers. Proxied answers keep every header the API sent
# ---- (Content-Type, ETag, Vary, Content-Digest, Signature-Input, Signature,
# ---- Trooth-Contract, Trooth-Semanto-Version, Trooth-Page-Hash,
# ---- Trooth-Signed-Page-Hash, Trooth-Signed-By, Trooth-Semanto-State, Link,
# ---- Content-Signal, x-markdown-tokens, x-original-tokens); only cookies and
# ---- server banners are removed. The site's own HTML gets the Link header.
Header set Trooth-Delivery trooth env=SEMANTO
Header unset Set-Cookie env=SEMANTO
Header unset Server env=SEMANTO
Header always set Link "<https://api.trooth.co/public/semanto/example-inc>; rel=\"https://trooth.co/rel/semanto\"" "expr=%{CONTENT_TYPE} =~ m#^text/html# && ! reqenv('SEMANTO')"
# Every response varies on Accept, the site's own HTML included.
Header always merge Vary Accept
