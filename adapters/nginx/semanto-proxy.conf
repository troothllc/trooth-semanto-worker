#
# Semanto host adapter for nginx, part 2: how a proxied request to the Trooth
# API is made and which headers come back. Include this file inside each
# location that proxies to the API. Headers listed with proxy_pass_header are
# the ones every adapter forwards (ARCHITECTURE.md house rule 10); nginx passes
# upstream headers by default, the list makes the contract explicit and keeps
# any hidden-by-default header visible.

proxy_http_version 1.1;
proxy_ssl_server_name on;
proxy_ssl_protocols TLSv1.2 TLSv1.3;
proxy_set_header Host api.trooth.co;
proxy_set_header Connection "";
proxy_set_header Accept $http_accept;
proxy_set_header Accept-Language $http_accept_language;
proxy_set_header If-None-Match $http_if_none_match;
proxy_set_header Signature-Input $http_signature_input;
proxy_set_header Signature $http_signature;
proxy_set_header Signature-Agent $http_signature_agent;
# nginx cannot sign, so it never sends Trooth-Forwarded-Authority: a reader
# through nginx is an "unproven reader" unless its request reaches the API
# directly (adapters/README.md). Clear any copy a client sent.
proxy_set_header Trooth-Forwarded-Authority "";
proxy_set_header Trooth-Forwarded-For "";
# Never send who the reader is; the API does not use it and neither does this file.
proxy_set_header User-Agent "";
proxy_set_header Cookie "";

proxy_pass_header Content-Type;
proxy_pass_header ETag;
proxy_pass_header Vary;
proxy_pass_header Content-Digest;
proxy_pass_header Signature-Input;
proxy_pass_header Signature;
proxy_pass_header Trooth-Contract;
proxy_pass_header Trooth-Semanto-Version;
proxy_pass_header Trooth-Page-Hash;
proxy_pass_header Trooth-Signed-Page-Hash;
proxy_pass_header Trooth-Signed-By;
proxy_pass_header Trooth-Semanto-State;
proxy_pass_header Link;
proxy_pass_header Content-Signal;
proxy_pass_header x-markdown-tokens;
proxy_pass_header x-original-tokens;

proxy_hide_header Set-Cookie;
proxy_hide_header Server;
proxy_hide_header CF-Ray;
proxy_hide_header CF-Cache-Status;
proxy_hide_header Report-To;
proxy_hide_header NEL;
proxy_hide_header Alt-Svc;

proxy_pass_header Cache-Control;

# Fail safe: the site never waits on Trooth for long and never shows a Trooth
# 5xx. A slow or failed call answers from the last good copy (kept at most an
# hour, about as long as its signature lasts), and with no copy the reader gets
# the site's own page from @semanto_host (semanto-server.conf).
proxy_connect_timeout 1s;
proxy_send_timeout 2s;
proxy_read_timeout 2s;
proxy_next_upstream off;
proxy_cache semanto;
proxy_cache_key "$scheme$proxy_host$uri$is_args$args|$semanto_rep|$http_accept";
proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
proxy_cache_background_update on;
proxy_cache_lock on;
proxy_cache_lock_timeout 1s;
proxy_ignore_headers Set-Cookie;
add_header Trooth-Delivery $semanto_delivery always;
proxy_intercept_errors on;
error_page 500 502 503 504 = @semanto_host;
proxy_buffering on;
