#
# Semanto host adapter for nginx, part 1: the decision, as maps. Include this
# file in the http {} block. The decision is made on the Accept header and the
# path suffix only (RFC 9110 section 12.5.1, with the outcomes Cloudflare's
# Markdown for Agents documents, 26 February 2026). Nothing here reads
# $http_user_agent. The maps are an approximation of full q-value negotiation
# that gives the same answer for every Accept header in the table in
# adapters/README.md; the Worker and PHP adapters carry the exact algorithm.

# 1 = markdown wins, 2 = JSON-LD wins, 0 = html (the site answers).
# A type wins when (a) it appears before any text/html entry and is not q=0,
# or (b) it appears at full weight (no q, or q=1) and text/html appears only
# with a q below 1. "*/*" alone, or no Accept header, is 0. An exact tie such
# as "text/html, text/markdown" stays 0 here (the Worker and PHP adapters
# break that tie toward markdown); browsers never send it.
map $http_accept $semanto_accept {
    default 0;
    "~*^(?:(?!text/html)[^,]*,\s*)*application/ld\+json(?:\s*;\s*q=(?!0(?:\.0+)?\s*(?:,|$))[^,]*)?\s*(?:,|$)" 2;
    "~*^(?!.*text/html\s*(?:;\s*(?!q=)[^;,]*\s*)*(?:,|$))(?!.*text/html[^,]*;\s*q=1(?:\.0*)?\s*(?:,|$)).*application/ld\+json\s*(?:;\s*(?!q=)[^;,]*\s*)*(?:;\s*q=1(?:\.0*)?\s*)?(?:,|$)" 2;
    "~*^(?:(?!text/html)[^,]*,\s*)*text/(?:markdown|\*)(?:\s*;\s*q=(?!0(?:\.0+)?\s*(?:,|$))[^,]*)?\s*(?:,|$)" 1;
    "~*^(?!.*text/html\s*(?:;\s*(?!q=)[^;,]*\s*)*(?:,|$))(?!.*text/html[^,]*;\s*q=1(?:\.0*)?\s*(?:,|$)).*text/(?:markdown|\*)\s*(?:;\s*(?!q=)[^;,]*\s*)*(?:;\s*q=1(?:\.0*)?\s*)?(?:,|$)" 1;
}

# The path suffix wins over the Accept header.
map $uri $semanto_suffix {
    default 0;
    "~*\.md$" 1;
    "~*\.jsonld$" 2;
}

map "$semanto_suffix:$semanto_accept" $semanto_rep {
    default 0;
    "~^1:" 1;
    "~^2:" 2;
    "~^0:1$" 1;
    "~^0:2$" 2;
}

# The Link header on the site's own HTML, so agents find the signed copy.
# Empty for everything else, and nginx does not add an empty header.
map $sent_http_content_type $semanto_link {
    default "";
    "~*^text/html" '<https://api.trooth.co/public/semanto/example-inc>; rel="https://trooth.co/rel/semanto"';
}
