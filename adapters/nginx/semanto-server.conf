#
# Semanto host adapter for nginx, part 3: the locations. Paste the lines
# marked "SETTINGS" and the locations into your server {} block, after your
# other `location =` blocks and before your main `location /`. Replace
# example-inc with your Trooth ID (also in semanto-maps.conf).
#
# proxy_pass with a variable needs a resolver, so the two SETTINGS lines are
# required. Reference: nginx.org/en/docs/http/ngx_http_proxy_module.html

# SETTINGS
set $trooth_api "https://api.trooth.co/public/semanto/example-inc";
resolver 1.1.1.1 8.8.8.8 valid=300s ipv6=off;

# ---- The well-known files and the llms files (all three modes serve the two
# ---- well-known files; remove the three llms locations for proof_only).
location = /.well-known/trooth.semanto {
    include /etc/nginx/semanto-proxy.conf;
    proxy_pass $trooth_api;
}
location = /.well-known/trooth-keys.json {
    include /etc/nginx/semanto-proxy.conf;
    proxy_pass $trooth_api/keys.json;
}
location = /llms.txt {
    include /etc/nginx/semanto-proxy.conf;
    proxy_pass $trooth_api/llms.txt;
}
location = /llms-full.txt {
    include /etc/nginx/semanto-proxy.conf;
    proxy_pass $trooth_api/llms-full.txt;
}
location = /sitemap.md {
    include /etc/nginx/semanto-proxy.conf;
    proxy_pass $trooth_api/sitemap.md;
}

# ---- Pages and facts (semanto_only mode). For proof_only, delete this block
# ---- and keep only the add_header lines in your own location /.
location / {
    include /etc/nginx/semanto-proxy.conf;

    # Markdown: the page by its path on this domain. The API resolves the path
    # through the current manifest and answers with the signed markdown, or a
    # markdown "not found" page; never an unsigned conversion.
    if ($semanto_rep = 1) {
        proxy_pass $trooth_api/by-path$uri;
    }
    # JSON-LD: the facts file, whatever the path.
    if ($semanto_rep = 2) {
        proxy_pass $trooth_api/facts.jsonld;
    }

    # The site's own HTML gets the Link header (empty value = not added).
    add_header Link $semanto_link;
    add_header Vary Accept;

    # Your existing configuration for the site continues here, for example:
    # try_files $uri $uri/ /index.php?$args;
}
