# Copyright (c) 2026 Trooth, LLC
#
# Publishes the `trooth` Python distribution (verifier/python) to PyPI, the way
# the Python Packaging User Guide and PyPI's own docs set it out:
#   - Trusted Publishing (OpenID Connect): PyPI trusts this workflow, in this
#     repository, in the `pypi` environment, and nothing else. No API token
#     exists to leak or rotate.
#   - Build and publish are separate jobs; only the publish job can mint the
#     short-lived upload credential (id-token: write), and it runs no build code.
#   - PEP 740 attestations are made and uploaded by the publish action by default.
#   - Every action is pinned to a full commit (OpenSSF Scorecard,
#     Pinned-Dependencies), with the release named beside it.
#   - The version in the tag must match pyproject.toml, so a release cannot ship
#     under the wrong number.
#   - After PyPI accepts the files, a GitHub release for the tag carries the same
#     files and notes generated from the commits since the last release.
# Release: bump version in verifier/python/pyproject.toml and trooth/__init__.py,
# then push a tag python-v<version> (for example python-v0.1.0).

name: Publish trooth to PyPI

on:
  push:
    tags: ["python-v*"]

permissions: {}

concurrency:
  group: publish-pypi
  cancel-in-progress: false

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: verifier/python
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: The tag names the version being built
        env:
          TAG: ${{ github.ref_name }}
        run: |
          want="${TAG#python-v}"
          have="$(python3 -c 'import tomllib;print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')"
          test "$want" = "$have" || { echo "tag $TAG does not match version $have in pyproject.toml"; exit 1; }
      - name: Test, the base package and every extra
        run: |
          python3 -m pip install --upgrade pip build twine pytest
          python3 -m pip install ".[langchain,llama-index,openai-agents]"
          python3 -m pytest -q -p no:cacheprovider test_integrations.py test_client.py test_vectors.py
      - name: Build the wheel and sdist
        run: |
          python3 -m build
          python3 -m twine check --strict dist/*
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: python-package-distributions
          path: verifier/python/dist/
          if-no-files-found: error

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/trooth
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: python-package-distributions
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3

  release:
    name: GitHub release
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: python-package-distributions
          path: dist/
      - name: Release the same files PyPI holds, with notes from the commits
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "trooth ${TAG#python-v}" --generate-notes
