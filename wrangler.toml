#
# The Semanto Worker's configuration (Cloudflare Workers, wrangler 4).
# The top level is development, under its own script name, so a plain
# `wrangler deploy` never replaces production; production is
# `wrangler deploy --env production` (npm run deploy).
#
# Secrets (wrangler secret put <NAME>, never committed):
#   TROOTH_WITNESS_KEY             Trooth's witness private JWK (JSON). Without it the Worker starts and
#                                  answers a 503 witness_key_missing problem wherever it must sign.
#   TROOTH_WITNESS_PREVIOUS_KEYS   optional: earlier witness public JWKs (JSON array), still served
#   HOSTED_KEY_SEAL_SECRET         32+ characters: seals hosted company keys at rest
#   RECEIPT_IP_SALT_SECRET         16+ characters: the daily salt for read-receipt address hashes
#   RESEND_API_KEY                 optional: plain-language alerts, setup emails and alert address confirmations
#   GOOGLE_OAUTH_CLIENT_ID         optional: Connect Google (Merchant Center and Business Profile write-back)
#   GOOGLE_OAUTH_CLIENT_SECRET     optional: the same OAuth client's secret
#   SEMANTO_EVENTS_SECRET          optional: HMAC key for recall events sent to worker-f (set the same value on worker-f)
#   OPENAI_API_KEY, ANTHROPIC_API_KEY, GEMINI_API_KEY, PERPLEXITY_API_KEY   optional: gap report providers
#
# Founder steps before the first deploy: create the D1 database and the KV namespace and put their
# ids where REPLACE_WITH_ stands below; create the R2 bucket trooth-semanto and the queues
# trooth-semanto-compile and trooth-semanto-compile-dlq; apply migrations 0001 to 0009 with
# `wrangler d1 migrations apply trooth_semanto --env production`. Each migration from 0007 on has a down
# file in migrations-down/ (never applied by wrangler).

name = "trooth-semanto-worker-dev"
main = "src/index.ts"
compatibility_date = "2026-06-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = false

[vars]
ENVIRONMENT = "development"
PUBLIC_API_BASE = "https://api.trooth.co/public/semanto"
NETWORK_BASE = "https://trooth.co/network/company"
LEDGER_URL = "https://api.trooth.co/public/semanto/log"
# Optional vars: TSA_URL (the RFC 3161 time-stamp authority; without it no tree head is timestamped),
# ALERT_FROM (the sender address for alerts and setup emails) and GOOGLE_OAUTH_REDIRECT_URI (where Google
# redirects after consent; https://api.trooth.co/public/semanto/google/callback when unset).
# Development only (src/dev-upstream.ts, ignored in production): DEV_UPSTREAM_BASE (a loopback origin that stands in for
# the Google and Resend hosts) and DEV_DASHBOARD_BASE (the dashboard on loopback); the QA stack in qa/ sets both.
# The compile queue also carries the workspace jobs (writeback, recall_event, credential): no new cron, no polling.

# Hourly: change detection for every signed company; nightly: tree head, RFC 3161 timestamp and revocation list;
# weekly: gap reports (src/gap/report.ts WEEKLY_RUN.cron is the same "0 6 * * 1"; src/serve/routes.ts runScheduled maps all three).
[triggers]
crons = ["15 * * * *", "30 1 * * *", "0 6 * * 1"]

[[d1_databases]]
binding = "DB"
database_name = "trooth_semanto"
database_id = "REPLACE_WITH_D1_ID"

[[r2_buckets]]
binding = "STORE"
bucket_name = "trooth-semanto"

[[kv_namespaces]]
binding = "CACHE"
id = "REPLACE_WITH_KV_ID"

[[queues.producers]]
binding = "COMPILE_QUEUE"
queue = "trooth-semanto-compile"

# One message at a time: a build stage of at most 25 pages, a compile job or a fan-out of 25 companies.
# A message that fails four times goes to the dead letter queue, and its build is marked failed in plain words.
[[queues.consumers]]
queue = "trooth-semanto-compile"
max_batch_size = 1
max_retries = 3
dead_letter_queue = "trooth-semanto-compile-dlq"

# worker-f, through this binding: the session check for the /os routes (src/pipeline.ts troothOsSession) and the workspace's domains on trooth.co
# (src/setup/workspace-domains.ts, GET /auth/domain-claims), both with the caller's own credential.
[[services]]
binding = "TROOTH_OS"
service = "trooth-os-worker-f"

# Durable Objects: NonceDO claims Web Bot Auth and connector nonces atomically (src/readers/nonce-do.ts);
# LogDO is the one writer for the public log, so appends are serialized (src/ledger/log-do.ts).
[[durable_objects.bindings]]
name = "NONCES"
class_name = "NonceDO"

[[durable_objects.bindings]]
name = "LOG"
class_name = "LogDO"

# RateLimitDO (src/readers/rate-limit.ts): token buckets per client address and route group, read receipts
# counted per minute and written to D1 once a minute, and the Web Bot Auth directory fetch limits.
# Alternative for the buckets alone: Cloudflare's rate limiting binding ([[unsafe.bindings]] type = "ratelimit"),
# which has no per-minute receipt counting.
[[durable_objects.bindings]]
name = "RATE"
class_name = "RateLimitDO"

# The migrations that create the classes (SQLite-backed storage). Migrations apply to every environment.
[[migrations]]
tag = "v1-nonce-and-log-durable-objects"
new_sqlite_classes = ["NonceDO", "LogDO"]

[[migrations]]
tag = "v2-rate-limit-durable-object"
new_sqlite_classes = ["RateLimitDO"]

[env.production]
name = "trooth-semanto-worker"
workers_dev = false
routes = [
  { pattern = "api.trooth.co/public/semanto", zone_name = "trooth.co" },
  { pattern = "api.trooth.co/public/semanto/*", zone_name = "trooth.co" },
  { pattern = "api.trooth.co/os/semanto/*", zone_name = "trooth.co" },
]

[env.production.vars]
ENVIRONMENT = "production"
PUBLIC_API_BASE = "https://api.trooth.co/public/semanto"
NETWORK_BASE = "https://trooth.co/network/company"
LEDGER_URL = "https://api.trooth.co/public/semanto/log"

[[env.production.d1_databases]]
binding = "DB"
database_name = "trooth_semanto"
database_id = "e4437dec-8720-4d78-8844-9598a3469ca8"

[[env.production.r2_buckets]]
binding = "STORE"
bucket_name = "trooth-semanto"

[[env.production.kv_namespaces]]
binding = "CACHE"
id = "df73a4ab9c1f40edac464212efca6149"

[[env.production.queues.producers]]
binding = "COMPILE_QUEUE"
queue = "trooth-semanto-compile"

[[env.production.queues.consumers]]
queue = "trooth-semanto-compile"
max_batch_size = 1
max_retries = 3
dead_letter_queue = "trooth-semanto-compile-dlq"

[[env.production.services]]
binding = "TROOTH_OS"
service = "trooth-os-worker-f"

[[env.production.durable_objects.bindings]]
name = "NONCES"
class_name = "NonceDO"

[[env.production.durable_objects.bindings]]
name = "LOG"
class_name = "LogDO"

[[env.production.durable_objects.bindings]]
name = "RATE"
class_name = "RateLimitDO"
